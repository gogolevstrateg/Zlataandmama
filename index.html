<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a1320">
<title>Злата и Полина</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;overflow:hidden;
  background:radial-gradient(circle at 50% 30%,#3d2b52 0%,#1a1320 70%);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-user-select:none;user-select:none;touch-action:none;
  display:flex;align-items:center;justify-content:center;color:#f5ecff;}
#stage{position:relative;border-radius:24px;overflow:hidden;
  box-shadow:0 30px 80px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.05);}
canvas{display:block;width:100%;height:100%;}
#pauseBtn{position:absolute;top:12px;right:12px;width:40px;height:40px;
  border:0;border-radius:50%;background:rgba(26,19,32,.85);color:#fff;font-size:18px;
  cursor:pointer;z-index:10;transition:transform .15s,background .15s;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-family:inherit;
  display:flex;align-items:center;justify-content:center;}
#pauseBtn:active{transform:scale(.95);}
#pauseBtn.hidden{display:none;}
#overlay{position:absolute;inset:0;background:rgba(26,19,32,.9);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  visibility:hidden;opacity:0;pointer-events:none;
  transition:opacity .3s ease,visibility 0s .3s;
  overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  touch-action:pan-y;
  padding:20px 20px max(20px, env(safe-area-inset-bottom)) 20px;}
#overlay.show{visibility:visible;opacity:1;pointer-events:auto;
  transition:opacity .3s ease,visibility 0s 0s;}
#overlay-content{width:100%;max-width:380px;margin:20px auto;text-align:center;
  animation:fadeUp .4s cubic-bezier(.2,.9,.3,1);}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
.ov-emoji{font-size:60px;line-height:1;margin-bottom:12px;
  filter:drop-shadow(0 10px 20px rgba(0,0,0,.5));}
.ov-title{font-size:28px;font-weight:900;margin:0 0 10px;
  background:linear-gradient(120deg,#ffd166,#ff8fb1);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  letter-spacing:-.5px;line-height:1.1;}
.ov-subtitle{font-size:14px;line-height:1.5;color:#b9a8d0;margin:0 0 20px;}
.ov-hint{font-size:13px;font-weight:700;color:#ffb84d;letter-spacing:.3px;
  margin:0 0 18px;padding:10px;background:rgba(255,184,77,.1);
  border-radius:12px;border:1px solid rgba(255,184,77,.25);}
.ov-btn{display:block;width:100%;border:0;border-radius:16px;
  padding:16px 32px;font-size:17px;font-weight:800;color:#241730;
  background:linear-gradient(180deg,#ffe08a,#ffb84d);
  box-shadow:0 6px 0 #c98a1f,0 12px 24px rgba(0,0,0,.4);
  cursor:pointer;font-family:inherit;transition:transform .08s,box-shadow .08s;margin-bottom:12px;}
.ov-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #c98a1f,0 4px 8px rgba(0,0,0,.3);}
.ov-btn.secondary{background:rgba(255,255,255,.1);color:#f5ecff;
  box-shadow:0 6px 0 rgba(0,0,0,.3),0 12px 24px rgba(0,0,0,.2);
  border:2px solid rgba(255,255,255,.15);}
.ov-btn.secondary:active{box-shadow:0 2px 0 rgba(0,0,0,.3);}
.level-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:20px;}
.level-btn{aspect-ratio:1;border:0;border-radius:10px;background:rgba(255,255,255,.08);
  color:#f5ecff;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;
  display:flex;align-items:center;justify-content:center;position:relative;
  transition:transform .15s,background .15s;border:2px solid transparent;
  padding:0;min-height:50px;}
.level-btn.unlocked{background:linear-gradient(180deg,#4d3a66,#3a2a4d);border-color:rgba(255,255,255,.1);}
.level-btn.unlocked:hover{transform:scale(1.06);border-color:#ffb84d;}
.level-btn.completed{background:linear-gradient(180deg,#4fc27a,#2e8a50);box-shadow:0 3px 0 #1a5c30;}
.level-btn.completed::after{content:"✓";position:absolute;top:-3px;right:-3px;
  width:14px;height:14px;border-radius:50%;background:#ffd166;color:#1a1320;
  font-size:10px;display:flex;align-items:center;justify-content:center;
  box-shadow:0 1px 4px rgba(0,0,0,.4);}
.progress-info{font-size:13px;color:#b9a8d0;margin-bottom:20px;}
.ov-link{background:none;border:0;color:rgba(255,255,255,.4);font-size:12px;
  cursor:pointer;text-decoration:underline;padding:8px;font-family:inherit;margin-top:4px;}
@media (max-width:480px){.ov-title{font-size:24px;}.ov-emoji{font-size:48px;}.level-btn{font-size:12px;min-height:44px;}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>
  <button id="pauseBtn" class="hidden" aria-label="Пауза">⏸</button>
  <div id="overlay"><div id="overlay-content"></div></div>
</div>
<script>
(function(){
'use strict';

var W=480,H=720;
var canvas=document.getElementById('game');
var ctx=canvas.getContext('2d');
var dpr=Math.min(window.devicePixelRatio||1,2);
canvas.width=W*dpr;canvas.height=H*dpr;ctx.scale(dpr,dpr);
var stage=document.getElementById('stage');
var overlay=document.getElementById('overlay');
var overlayContent=document.getElementById('overlay-content');
var pauseBtn=document.getElementById('pauseBtn');
function resize(){
  var s=Math.min((window.innerWidth-16)/W,(window.innerHeight-16)/H,1.5);
  stage.style.width=Math.floor(W*s)+'px';
  stage.style.height=Math.floor(H*s)+'px';
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){setTimeout(resize,200);});
resize();

var TAU=Math.PI*2;
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function rand(a,b){return a+Math.random()*(b-a);}
function lerp(a,b,t){return a+(b-a)*t;}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}
function rr(c,x,y,w,h,r){r=Math.min(r,Math.abs(w)/2,Math.abs(h)/2);
  c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);
  c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}

function findFreeSpot(obstacles, padding){
  padding = padding || 40;
  for(var attempt=0;attempt<80;attempt++){
    var x = rand(FIELD.x+50, FIELD.x+FIELD.w-50);
    var y = rand(FIELD.y+110, FIELD.y+FIELD.h-40);
    var ok = true;
    for(var j=0;j<obstacles.length;j++){
      var o = obstacles[j];
      if(x > o.x - padding && x < o.x + o.w + padding &&
         y > o.y - padding && y < o.y + o.h + padding){
        ok = false; break;
      }
    }
    if(ok) return {x:x, y:y};
  }
  return {x: FIELD.x+FIELD.w/2, y: FIELD.y+FIELD.h/2};
}

var actx=null;
function ensureAudio(){try{if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();
  if(actx.state==='suspended')actx.resume();}catch(e){}}
function tone(freq,dur,type,vol,slide,delay){
  try{if(!actx)return;var t0=actx.currentTime+(delay||0);
    var o=actx.createOscillator(),g=actx.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(freq,t0);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,slide),t0+dur);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(vol||.05,t0+.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g);g.connect(actx.destination);o.start(t0);o.stop(t0+dur+.03);}catch(e){}}

var SAVE_KEY='zp_v8';
var save={completed:[]};
function loadSave(){try{var raw=localStorage.getItem(SAVE_KEY);
  if(raw){var p=JSON.parse(raw);
    if(p&&Array.isArray(p.completed)){
      save.completed=p.completed.filter(function(n){return typeof n==='number'&&n>=1&&n<=50;});}}
}catch(e){}}
function persistSave(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}}
loadSave();

var input={left:false,right:false,up:false,down:false};
var joy={active:false,ox:0,oy:0,dx:0,dy:0,max:68,pid:null};
var tapQueued=null;
var dragPos=null;
var lastDragPos={x:0,y:0};
function toLocal(e){var r=canvas.getBoundingClientRect();
  return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};}

function shouldUseJoystick(){
  if(!L||!L.impl)return false;
  if(typeof L.impl.shouldUseJoystick === 'function'){
    return L.impl.shouldUseJoystick(L);
  }
  return !!L.impl.joystick;
}

canvas.addEventListener('pointerdown',function(e){
  e.preventDefault();ensureAudio();
  if(appScene!=='play'||!L)return;
  var p=toLocal(e);
  if(shouldUseJoystick()){
    joy.active=true;joy.ox=p.x;joy.oy=p.y;joy.dx=0;joy.dy=0;joy.pid=e.pointerId;
  } else if(L.impl.drag){
    dragPos={x:p.x,y:p.y};
    lastDragPos={x:p.x,y:p.y};
    if(L.impl.onDragStart)L.impl.onDragStart(L,p.x,p.y);
  } else {
    tapQueued={x:p.x,y:p.y};
    if(L.impl.onTap)L.impl.onTap(L,p.x,p.y);
  }
});
window.addEventListener('pointermove',function(e){
  if(!L)return;
  var p=toLocal(e);
  if(joy.active&&joy.pid===e.pointerId){
    var dx=p.x-joy.ox,dy=p.y-joy.oy,d=Math.hypot(dx,dy);
    if(d>joy.max){dx=dx/d*joy.max;dy=dy/d*joy.max;}
    joy.dx=dx/joy.max;joy.dy=dy/joy.max;
  }
  if(L.impl.drag&&dragPos){
    dragPos={x:p.x,y:p.y};
    lastDragPos={x:p.x,y:p.y};
    if(L.impl.onDrag)L.impl.onDrag(L,p.x,p.y);
  }
});
function ptrUp(e){
  if(joy.pid===e.pointerId){joy.active=false;joy.dx=0;joy.dy=0;joy.pid=null;}
  if(L&&L.impl.drag&&dragPos){
    dragPos=null;
    if(L.impl.onDragEnd)L.impl.onDragEnd(L,lastDragPos.x,lastDragPos.y);
  }
}
window.addEventListener('pointerup',ptrUp);
window.addEventListener('pointercancel',ptrUp);

window.addEventListener('keydown',function(e){
  var k=e.key.toLowerCase();
  if(k==='arrowleft'||k==='a'||k==='ф')input.left=true;
  if(k==='arrowright'||k==='d'||k==='в')input.right=true;
  if(k==='arrowup'||k==='w'||k==='ц')input.up=true;
  if(k==='arrowdown'||k==='s'||k==='ы')input.down=true;
  if(['arrowleft','arrowright','arrowup','arrowdown',' '].indexOf(k)>=0)e.preventDefault();
  if(k==='escape'&&(appScene==='play'||appScene==='paused'))togglePause();
});
window.addEventListener('keyup',function(e){
  var k=e.key.toLowerCase();
  if(k==='arrowleft'||k==='a'||k==='ф')input.left=false;
  if(k==='arrowright'||k==='d'||k==='в')input.right=false;
  if(k==='arrowup'||k==='w'||k==='ц')input.up=false;
  if(k==='arrowdown'||k==='s'||k==='ы')input.down=false;
});

document.addEventListener('touchmove',function(e){
  var t = e.target;
  if(t && t.closest && t.closest('#overlay'))return;
  e.preventDefault();
},{passive:false});

var Z={x:0,y:0,dir:1,walking:false,scale:0.85,skin:'#f8d5b8',hair:'#b89b78'};
var P={x:0,y:0,dir:-1,walking:false,scale:1.1,skin:'#f6d3b6',hair:'#6b4a2f',
  shirt:'#55555e',emotion:'calm',armsUp:false,hitCd:0,stuck:0,sgn:1};
var FIELD={x:24,y:104,w:W-48,h:H-104-24};

var game={irr:0,lives:3,t:0,time:0,flash:0};
var L=null;
var appScene='menu';
var paused=false;
var particles=[];
var floats=[];
var actionCd=0;

function burst(x,y,color,count){
  for(var i=0;i<count;i++)particles.push({
    x:x,y:y,vx:rand(-140,140),vy:rand(-200,-30),
    life:rand(.4,.8),max:.8,color:color,r:rand(2,5)});
}
function ftext(x,y,text,color){floats.push({x:x,y:y,text:text,color:color,life:1,max:1});}
function updateParticles(dt){
  for(var i=particles.length-1;i>=0;i--){var p=particles[i];
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=520*dt;p.life-=dt;
    if(p.life<=0)particles.splice(i,1);}
  for(var j=floats.length-1;j>=0;j--){var t=floats[j];
    t.y-=55*dt;t.life-=dt;if(t.life<=0)floats.splice(j,1);}
}
function drawParticles(){
  for(var i=0;i<particles.length;i++){var p=particles[i];
    var a=clamp(p.life/p.max,0,1);ctx.globalAlpha=a;ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r*a+.5,0,TAU);ctx.fill();}
  ctx.globalAlpha=1;ctx.textAlign='center';ctx.textBaseline='middle';
  for(var j=0;j<floats.length;j++){var t=floats[j];
    var al=clamp(t.life/t.max,0,1);ctx.globalAlpha=al;
    ctx.font='800 18px -apple-system,system-ui,sans-serif';
    ctx.fillStyle=t.color;ctx.fillText(t.text,t.x,t.y);}
  ctx.globalAlpha=1;
}

function clampToField(p){
  p.x=clamp(p.x,FIELD.x+18,FIELD.x+FIELD.w-18);
  p.y=clamp(p.y,FIELD.y+46,FIELD.y+FIELD.h-8);
}
function getMoveDir(){
  var dx=0,dy=0;
  if(input.left)dx-=1;if(input.right)dx+=1;if(input.up)dy-=1;if(input.down)dy+=1;
  if(dx||dy){var m=Math.hypot(dx,dy);return{x:dx/m,y:dy/m,mag:1};}
  if(joy.active&&(joy.dx||joy.dy)){
    return{x:joy.dx,y:joy.dy,mag:Math.min(1,Math.hypot(joy.dx,joy.dy))};}
  return{x:0,y:0,mag:0};
}
function resolveObstacles(p,rad){
  if(!L||!L.obs)return;
  for(var i=0;i<L.obs.length;i++){var o=L.obs[i];
    var cx=clamp(p.x,o.x,o.x+o.w),cy=clamp(p.y,o.y,o.y+o.h);
    var dx=p.x-cx,dy=p.y-cy,d=Math.hypot(dx,dy);
    if(d<rad){
      if(d<.001){var l=p.x-o.x,r=o.x+o.w-p.x,t=p.y-o.y,b=o.y+o.h-p.y;
        var m=Math.min(l,r,t,b);
        if(m===l)p.x=o.x-rad;else if(m===r)p.x=o.x+o.w+rad;
        else if(m===t)p.y=o.y-rad;else p.y=o.y+o.h+rad;
      }else{p.x=cx+dx/d*rad;p.y=cy+dy/d*rad;}}}
}
function moveZ(dt,speed){
  var d=getMoveDir();
  if(d.mag>0){
    Z.x+=d.x*speed*d.mag*dt;Z.y+=d.y*speed*d.mag*dt;Z.walking=true;
    if(d.x>.15)Z.dir=1;else if(d.x<-.15)Z.dir=-1;
  }else Z.walking=false;
  resolveObstacles(Z,15);clampToField(Z);
}
function chaseP(dt,speed){
  var dx=Z.x-P.x,dy=Z.y-P.y,d=Math.hypot(dx,dy)||1,px=P.x,py=P.y;
  P.x+=dx/d*speed*dt;P.y+=dy/d*speed*dt;
  P.dir=dx>0?1:-1;P.walking=true;
  resolveObstacles(P,16);clampToField(P);
  var moved=Math.hypot(P.x-px,P.y-py);
  if(moved<speed*dt*.45){
    P.stuck+=dt;var nx=-dy/d,ny=dx/d;
    P.x+=nx*P.sgn*speed*dt*.9;P.y+=ny*P.sgn*speed*dt*.9;
    if(P.stuck>.55){P.sgn*=-1;P.stuck=0;}
  }else P.stuck=0;
}
function checkCaught(){
  if(P.hitCd>0)return false;
  if(dist(Z,P)<32){
    P.hitCd=1.7;game.lives--;game.flash=.45;
    var dx=Z.x-P.x,dy=Z.y-P.y,d=Math.hypot(dx,dy)||1;
    Z.x+=dx/d*95;Z.y+=dy/d*95;clampToField(Z);
    tone(170,.28,'sawtooth',.08,60);burst(Z.x,Z.y-30,'#ff4757',14);
    ftext(Z.x,Z.y-70,'Поймала!','#ff6b81');
    if(game.lives<=0){triggerLose();return true;}
    return true;
  }
  return false;
}

function drawDangerObject(x, y, emoji, radius){
  radius = radius || 28;
  var g = ctx.createRadialGradient(x, y, radius*0.6, x, y, radius*2.2);
  g.addColorStop(0, 'rgba(255,60,90,0.55)');
  g.addColorStop(0.5, 'rgba(255,60,90,0.25)');
  g.addColorStop(1, 'rgba(255,60,90,0)');
  ctx.fillStyle = g;ctx.beginPath();ctx.arc(x, y, radius*2.2, 0, TAU);ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.beginPath();ctx.ellipse(x, y + radius*0.9, radius*0.85, radius*0.28, 0, 0, TAU);ctx.fill();
  var bg = ctx.createRadialGradient(x - radius*0.3, y - radius*0.3, radius*0.15, x, y, radius);
  bg.addColorStop(0, '#ff8a95');bg.addColorStop(0.6, '#ff4757');bg.addColorStop(1, '#c92a2a');
  ctx.fillStyle = bg;ctx.beginPath();ctx.arc(x, y, radius, 0, TAU);ctx.fill();
  ctx.strokeStyle = '#ffffff';ctx.lineWidth = 3.5;
  ctx.beginPath();ctx.arc(x, y, radius, 0, TAU);ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.font = Math.floor(radius*1.35) + 'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
  ctx.textAlign = 'center';ctx.textBaseline = 'middle';ctx.fillText(emoji, x, y + 2);
}

/* ИСПРАВЛЕНО: явный тёмный цвет текста — цифры на пузырях видны */
function drawCollectible(x, y, emoji, radius){
  radius = radius || 28;
  var g = ctx.createRadialGradient(x, y, radius*0.5, x, y, radius*1.9);
  g.addColorStop(0, 'rgba(255,220,80,0.7)');
  g.addColorStop(0.55, 'rgba(255,220,80,0.25)');
  g.addColorStop(1, 'rgba(255,220,80,0)');
  ctx.fillStyle = g;ctx.beginPath();ctx.arc(x, y, radius*1.9, 0, TAU);ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  ctx.beginPath();ctx.ellipse(x, y + radius*1.05, radius*0.9, radius*0.3, 0, 0, TAU);ctx.fill();
  ctx.fillStyle = '#ffffff';ctx.beginPath();ctx.arc(x, y, radius, 0, TAU);ctx.fill();
  ctx.strokeStyle = '#ffb84d';ctx.lineWidth = 3.5;
  ctx.beginPath();ctx.arc(x, y, radius, 0, TAU);ctx.stroke();
  ctx.strokeStyle = 'rgba(255,220,120,0.65)';ctx.lineWidth = 1.5;
  ctx.beginPath();ctx.arc(x, y, radius - 4.5, 0, TAU);ctx.stroke();
  ctx.fillStyle = '#1a0f28';
  ctx.font = 'bold ' + Math.floor(radius * 1.05) + 'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",-apple-system,BlinkMacSystemFont,sans-serif';
  ctx.textAlign = 'center';ctx.textBaseline = 'middle';
  ctx.fillText(emoji, x, y + 2);
}

function drawPolina(t,opts){
  opts=opts||{};
  var p=P,s=p.scale,dir=p.dir||1,walk=p.walking;
  var bob=walk?Math.abs(Math.sin(t*11))*2.5:Math.sin(t*2.5)*.8;
  var emo=opts.emotion||p.emotion||'calm';
  ctx.fillStyle='rgba(0,0,0,.15)';
  ctx.beginPath();ctx.ellipse(p.x,p.y+1,17*s,6*s,0,0,TAU);ctx.fill();
  ctx.save();ctx.translate(p.x,p.y-bob);ctx.scale(s*dir,s);
  var sw=walk?Math.sin(t*11)*7:0;
  ctx.strokeStyle='#2f2f38';ctx.lineWidth=7;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(-4,-14);ctx.lineTo(-4+sw,-1);
  ctx.moveTo(4,-14);ctx.lineTo(4-sw,-1);ctx.stroke();
  ctx.fillStyle=p.hair;
  ctx.beginPath();ctx.ellipse(0,-36,15,22,0,0,TAU);ctx.fill();
  for(var i=0;i<4;i++){
    ctx.beginPath();ctx.arc(-13,-28+i*6,6,0,TAU);ctx.fill();
    ctx.beginPath();ctx.arc(13,-28+i*6,6,0,TAU);ctx.fill();
  }
  ctx.fillStyle=p.shirt;rr(ctx,-11,-36,22,24,8);ctx.fill();
  ctx.fillStyle='rgba(0,0,0,0.1)';rr(ctx,-11,-36,22,7,7);ctx.fill();
  ctx.strokeStyle=p.skin;ctx.lineWidth=5;
  if(opts.armsUp||p.armsUp){
    var w=Math.sin(t*18)*5;

        x:fromLeft ? -40 : W+40,

/* ИСПРАВЛЕНО ПОЛНОСТЬЮ: тоннель с прокручивающимися проёмами */
IMPL.tunnel={
  joystick:true,
  init:function(L){
    var s=L.state;
    s.dist=0;
    s.target=1400;
    s.speed=150;      // скорость прокрутки проёмов
    s.spacing=210;    // расстояние между проёмами
    s.gapH=170;       // высота проёма (стена = 40)
    s.gaps=[];
    for(var i=0;i<8;i++){
      s.gaps.push({
        y: FIELD.y - 400 + i * s.spacing,
        h: s.gapH
      });
    }
    s.spawnTimer=0;
    s.inWall=false;
    // Игрок стартует ВНУТРИ первого проёма
    Z.x=W/2;
    Z.y=FIELD.y + 20 + s.gapH/2;  // в середине первого проёма
    Z.dir=1;
    Z.walking=false;
    P.x=240;P.y=180;P.dir=-1;P.walking=false;
    P.emotion='calm';P.armsUp=false;
  },
  update:function(L,dt){
    var s=L.state;
    // Прокрутка проёмов вниз
    for(var i=0;i<s.gaps.length;i++){
      s.gaps[i].y += s.speed * dt;
    }
    // Удаляем проёмы, ушедшие ниже поля
    var newGaps=[];
    for(var i=0;i<s.gaps.length;i++){
      if(s.gaps[i].y < FIELD.y + FIELD.h + 60){
        newGaps.push(s.gaps[i]);
      }
    }
    s.gaps = newGaps;
    // Добавляем новые проёмы сверху
    s.spawnTimer -= dt;
    if(s.gaps.length < 6 && s.spawnTimer <= 0){
      var topY = (s.gaps.length > 0) ? s.gaps[0].y - s.spacing : FIELD.y - 400;
      s.gaps.unshift({y: topY, h: s.gapH});
      s.spawnTimer = 0.05;
    }
    // Движение игрока
    moveZ(dt, 260);
    // Проверка: игрок в ЛЮБОМ проёме?
    var safe = false;
    for(var i=0;i<s.gaps.length;i++){
      var g = s.gaps[i];
      if(Z.y >= g.y && Z.y <= g.y + g.h){
        safe = true;
        break;
      }
    }
    if(!safe){
      if(!s.inWall){
        s.inWall = true;
        game.lives--;
        game.flash = .4;
        tone(150, .3, 'sawtooth', .08);
        if(game.lives <= 0){ triggerLose(); return; }
      }
    } else {
      s.inWall = false;
      s.dist += 220 * dt;
    }
    game.irr = clamp(s.dist / s.target * 100, 0, 100);
    if(s.dist >= s.target && !L.won){ L.won = true; triggerWin(); }
  },
  render:function(L){
    var s = L.state;
    // Тёмный фон (космос)
    ctx.fillStyle = '#1a0f28';
    ctx.fillRect(0, 0, W, H);
    // Светлая "стена" - весь прямоугольник поля
    ctx.fillStyle = '#5a4a7a';
    ctx.fillRect(FIELD.x, FIELD.y, FIELD.w, FIELD.h);
    // Проёмы (тёмные окна) поверх стены
    for(var i=0;i<s.gaps.length;i++){
      var g = s.gaps[i];
      var top = Math.max(g.y, FIELD.y);
      var bot = Math.min(g.y + g.h, FIELD.y + FIELD.h);
      if(bot > top){
        // Тёмный проём
        ctx.fillStyle = '#1a0f28';
        ctx.fillRect(FIELD.x, top, FIELD.w, bot - top);
        // Светлая окантовка
        ctx.strokeStyle = '#ff8fb1';
        ctx.lineWidth = 3;
        if(g.y >= FIELD.y && g.y < FIELD.y + FIELD.h){
          ctx.beginPath();
          ctx.moveTo(FIELD.x, g.y);
          ctx.lineTo(FIELD.x + FIELD.w, g.y);
          ctx.stroke();
        }
        if(g.y + g.h > FIELD.y && g.y + g.h <= FIELD.y + FIELD.h){
          ctx.beginPath();
          ctx.moveTo(FIELD.x, g.y + g.h);
          ctx.lineTo(FIELD.x + FIELD.w, g.y + g.h);
          ctx.stroke();
        }
      }
    }
    // Красная подсветка если в стене
    if(s.inWall){
      ctx.fillStyle = 'rgba(255,0,0,0.2)';
      ctx.fillRect(0, 0, W, H);
    }
    // Ракета
    ctx.fillStyle = '#ffb84d';
    ctx.beginPath();
    ctx.arc(Z.x, Z.y, 22, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(Z.x, Z.y, 22, 0, TAU);
    ctx.stroke();
    ctx.font = '28px "Apple Color Emoji",sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('🚀', Z.x, Z.y);
    // Прогресс
    ctx.fillStyle = 'rgba(255,255,255,.15)';
    rr(ctx, 40, H-30, W-80, 10, 5);
    ctx.fill();
    ctx.fillStyle = '#51cf66';
    rr(ctx, 40, H-30, (W-80) * clamp(s.dist/s.target, 0, 1), 10, 5);
    ctx.fill();
    chip('🕳️ ' + Math.floor(s.dist) + ' / ' + s.target, W/2, 112, '#ff8fb1');
  }
};

  joystick:false,

    ctx.strokeStyle='#fff';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(W/2,s.lineY,10,0,TAU);ctx.stroke();
    for(var i=0;i<s.fish.length;i++){var f=s.fish[i];

    if(s.lineState==='up'){ctx.fillStyle='#ffb84d';
      ctx.font='800 20px -apple-system,system-ui,sans-serif';
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText('ТАПАЙ!',W/2,FIELD.y+50);}
    drawZlata(game.t,{emotion:'serious'});

IMPL.math={
  joystick:false,
  init:function(L){var s=L.state;s.correct=0;s.needed=8;s.time=0;s.dur=30;
    s.problem='';s.answer=0;s.choices=[];
    Z.x=240;Z.y=680;Z.dir=1;Z.walking=false;P.x=240;P.y=180;P.dir=-1;P.walking=false;
    P.emotion='calm';P.armsUp=false;
    s.newProblem=function(){
      var a=Math.floor(Math.random()*10)+1;var b=Math.floor(Math.random()*10)+1;
      var op=Math.random()<.5?'+':'-';
      if(op==='-'&&a<b){var t=a;a=b;b=t;}
      s.answer=op==='+'?a+b:a-b;
      s.problem=a+' '+op+' '+b+' = ?';
      s.choices=[s.answer];
      var safety=0;
      while(s.choices.length<4&&safety<100){
        safety++;
        var wrong=s.answer+Math.floor(Math.random()*11)-5;
        if(wrong<0)wrong=Math.abs(wrong)+1;
        if(wrong!==s.answer&&s.choices.indexOf(wrong)===-1)s.choices.push(wrong);
      }
      for(var i=s.choices.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));
        var t=s.choices[i];s.choices[i]=s.choices[j];s.choices[j]=t;}
    };
    s.newProblem();},
  update:function(L,dt){var s=L.state;s.time+=dt;
    game.irr=s.correct/s.needed*100;
    if(s.time>=s.dur&&!L.won&&s.correct<s.needed){triggerLose();}},
  onTap:function(L,x,y){var s=L.state;
    var boxW=W/2-40,boxH=80;var startX=30,startY=H-260;
    for(var i=0;i<4;i++){var bx=startX+(i%2)*(boxW+20),by=startY+Math.floor(i/2)*(boxH+15);
      if(x>=bx&&x<=bx+boxW&&y>=by&&y<=by+boxH){
        if(s.choices[i]===s.answer){s.correct++;tone(700,.1,'triangle',.07,900);
          burst(bx+boxW/2,by+boxH/2,'#51cf66',10);
          s.newProblem();
          if(s.correct>=s.needed&&!L.won){L.won=true;triggerWin();}}
        else{game.lives--;game.flash=.3;tone(150,.2,'sawtooth',.06);
          if(game.lives<=0){triggerLose();return;}}
        return;}}},
  render:function(L){drawFloorBg('#e8e0f5','#d8d0ed');var s=L.state;

    ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#fff';
    ctx.fillText(s.problem,W/2,300);
    var boxW=W/2-40,boxH=80;var startX=30,startY=H-260;
    for(var i=0;i<4;i++){var bx=startX+(i%2)*(boxW+20),by=startY+Math.floor(i/2)*(boxH+15);
      ctx.fillStyle='#ffffff';rr(ctx,bx,by,boxW,boxH,12);ctx.fill();
      ctx.strokeStyle='#ffb84d';ctx.lineWidth=3;
      rr(ctx,bx,by,boxW,boxH,12);ctx.stroke();
      ctx.fillStyle='#241730';ctx.font='900 36px -apple-system,system-ui,sans-serif';
      ctx.fillText(s.choices[i],bx+boxW/2,by+boxH/2);}
    drawZlata(game.t,{emotion:'serious'});
    chip('🔢 '+s.correct+' / '+s.needed+' · '+Math.max(0,s.dur-s.time).toFixed(0)+'с',W/2,112,'#ffb84d');}
};

IMPL.ultimate={
  joystick:true,
  shouldUseJoystick:function(L){return L && L.state && L.state.phase === 2;},
  init:function(L){var s=L.state;
    s.phase=1;
    s.phase1Taps=0;s.phase1Needed=12;s.polinaTaps=0;
    s.phase2Time=0;s.phase2Dur=12;s.objects=[];s.spawnT=0;
    s.phase3Hits=0;s.phase3Needed=6;s.phase3Targets=[];s.spawnT3=0;
    Z.x=240;Z.y=600;Z.dir=1;Z.walking=false;P.x=240;P.y=200;P.dir=-1;P.walking=false;
    P.emotion='angry';P.armsUp=true;P.hitCd=0;L.obs=[];},
  update:function(L,dt){var s=L.state;
    if(s.phase===1){
      game.irr=s.phase1Taps/s.phase1Needed*33;
      s.polinaTaps+=1.2*dt;
      if(s.phase1Taps>=s.phase1Needed){
        s.phase=2;
        tone(523,.1,'square',.06);tone(784,.2,'square',.06,0,.1);
        joy.active=false;joy.dx=0;joy.dy=0;joy.pid=null;
      }else if(s.polinaTaps>=s.phase1Needed){triggerLose();}
    }
    else if(s.phase===2){
      s.phase2Time+=dt;
      game.irr=33+(s.phase2Time/s.phase2Dur)*33;
      s.spawnT-=dt;
      if(s.spawnT<=0){
        s.objects.push({x:rand(FIELD.x+40,FIELD.x+FIELD.w-40),y:135,
          vy:rand(140,180),e:'💣'});
        s.spawnT=.7;
      }
      moveZ(dt,220);
      for(var i=s.objects.length-1;i>=0;i--){var o=s.objects[i];o.y+=o.vy*dt;
        if(o.y>H+40){s.objects.splice(i,1);continue;}
        if(Math.hypot(Z.x-o.x,Z.y-o.y)<32){
          s.objects.splice(i,1);game.lives--;game.flash=.4;
          tone(170,.25,'sawtooth',.08,60);
          if(game.lives<=0){triggerLose();return;}
        }
      }
      if(s.phase2Time>=s.phase2Dur){
        s.phase=3;
        tone(523,.1,'square',.06);tone(659,.1,'square',.06,0,.1);
        joy.active=false;joy.dx=0;joy.dy=0;joy.pid=null;
        s.spawnT3=0;
      }
    }
    else if(s.phase===3){
      game.irr=66+(s.phase3Hits/s.phase3Needed)*34;
      s.spawnT3-=dt;
      if(s.spawnT3<=0&&s.phase3Targets.length<3){
        var side=Math.random()<.5?-1:1;
        s.phase3Targets.push({x:side<0?-40:W+40,y:rand(FIELD.y+100,FIELD.y+FIELD.h-100),
          vx:side<0?rand(100,150):-rand(100,150),e:'🎯',r:32});
        s.spawnT3=.6;
      }
      for(var i=s.phase3Targets.length-1;i>=0;i--){var t=s.phase3Targets[i];
        t.x+=t.vx*dt;
        if(t.x<-60||t.x>W+60)s.phase3Targets.splice(i,1);}
      if(s.phase3Hits>=s.phase3Needed&&!L.won){L.won=true;triggerWin();}
    }
  },
  onTap:function(L,x,y){var s=L.state;
    if(s.phase===1){
      if(Math.hypot(x-W/2,y-400)<140){
        s.phase1Taps++;
        tone(400+Math.random()*200,.05,'square',.05);
        burst(W/2+(Math.random()-.5)*160,400+(Math.random()-.5)*160,'#ffe066',4);
        ftext(W/2,260,'+1','#ffe066');
      }
    }
    else if(s.phase===3){
      for(var i=s.phase3Targets.length-1;i>=0;i--){var t=s.phase3Targets[i];
        if(Math.hypot(x-t.x,y-t.y)<t.r+12){
          s.phase3Hits++;
          tone(700,.1,'square',.08,900);
          burst(t.x,t.y,'#ffe066',10);
          s.phase3Targets.splice(i,1);
          if(s.phase3Hits>=s.phase3Needed&&!L.won){L.won=true;triggerWin();}
          return;
        }
      }
    }
  },
  render:function(L){
    var s=L.state;
    if(s.phase===1){
      drawFloorBg('#f0d0d0','#e0b0b0');
      var pulse=(Math.sin(game.t*6)+1)/2;
      ctx.fillStyle='rgba(255,184,77,'+(0.5+0.5*pulse)+')';
      ctx.font='800 18px -apple-system,system-ui,sans-serif';ctx.textAlign='center';
      ctx.textBaseline='middle';ctx.fillText('ФАЗА 1/3 — ТАПАЙ!',W/2,250);
      var scale=1+Math.sin(game.t*6)*.04;ctx.save();
      ctx.translate(W/2,400);ctx.scale(scale,scale);
      var g=ctx.createRadialGradient(-40,-40,10,0,0,130);
      g.addColorStop(0,'#ff4040');g.addColorStop(1,'#c01010');
      ctx.beginPath();ctx.arc(0,0,130,0,TAU);ctx.fillStyle=g;ctx.fill();
      ctx.strokeStyle='#fff';ctx.lineWidth=5;ctx.stroke();
      ctx.fillStyle='#fff';ctx.font='900 40px -apple-system,system-ui,sans-serif';
      ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('ТАП',0,0);ctx.restore();
      drawPolina(game.t,{emotion:'angry',armsUp:true});drawZlata(game.t,{emotion:'serious'});
      ctx.fillStyle='rgba(0,0,0,.4)';rr(ctx,60,540,W-120,14,7);ctx.fill();
      ctx.fillStyle='#4dabf7';rr(ctx,60,540,(W-120)*clamp(s.phase1Taps/s.phase1Needed,0,1),14,7);ctx.fill();
      ctx.fillStyle='rgba(0,0,0,.4)';rr(ctx,60,562,W-120,14,7);ctx.fill();
      ctx.fillStyle='#ff6b81';rr(ctx,60,562,(W-120)*clamp(s.polinaTaps/s.phase1Needed,0,1),14,7);ctx.fill();
      ctx.font='800 12px -apple-system,system-ui,sans-serif';ctx.textAlign='left';
      ctx.fillStyle='#4dabf7';ctx.fillText('Злата: '+s.phase1Taps,66,538);
      ctx.fillStyle='#ff6b81';ctx.fillText('Полина: '+Math.floor(s.polinaTaps),66,560);
      chip('👑 ФАЗА 1 / 3',W/2,112,'#ffb84d');
    }
    else if(s.phase===2){
      drawFloorBg('#f0d0d0','#e0b0b0');
      var pulse2=(Math.sin(game.t*6)+1)/2;
      ctx.fillStyle='rgba(255,140,180,'+(0.5+0.5*pulse2)+')';
      ctx.font='800 18px -apple-system,system-ui,sans-serif';ctx.textAlign='center';
      ctx.textBaseline='middle';ctx.fillText('ФАЗА 2/3 — УВОРАЧИВАЙСЯ!',W/2,250);
      for(var i=0;i<s.objects.length;i++)drawDangerObject(s.objects[i].x,s.objects[i].y,s.objects[i].e,26);
      drawPolina(game.t,{emotion:'angry',armsUp:true});drawZlata(game.t,{emotion:'serious'});
      chip('⏱ '+Math.max(0,s.phase2Dur-s.phase2Time).toFixed(1)+' с',W/2,112,'#ff8fb1');
    }
    else{
      drawFloorBg('#f0d0d0','#e0b0b0');
      var pulse3=(Math.sin(game.t*6)+1)/2;
      ctx.fillStyle='rgba(255,184,77,'+(0.5+0.5*pulse3)+')';
      ctx.font='800 18px -apple-system,system-ui,sans-serif';ctx.textAlign='center';
      ctx.textBaseline='middle';ctx.fillText('ФАЗА 3/3 — СТРЕЛЯЙ!',W/2,250);
      for(var i=0;i<s.phase3Targets.length;i++){var t=s.phase3Targets[i];
        drawCollectible(t.x,t.y,t.e,26);}
      drawPolina(game.t,{emotion:'angry',armsUp:true});drawZlata(game.t,{emotion:'serious'});
      chip('🎯 '+s.phase3Hits+' / '+s.phase3Needed,W/2,112,'#ffb84d');
    }
  }
};

function initLevel(num){
  var meta=META[num-1];
  L={num:num,meta:meta,impl:IMPL[meta.type],state:{},obs:[],won:false,t:0};
  game.irr=0;game.lives=3;game.time=0;game.flash=0;
  particles=[];floats=[];
  P.hitCd=0;P.stuck=0;P.sgn=1;P.emotion='calm';P.armsUp=false;
  joy.active=false;joy.dx=0;joy.dy=0;joy.pid=null;
  dragPos=null;tapQueued=null;lastDragPos={x:0,y:0};
  try{L.impl.init(L);}catch(e){console.error(e);}
}

function updateLevel(dt){
  if(!L)return;
  L.t+=dt;
  if(L.impl.update)try{L.impl.update(L,dt);}catch(e){console.error(e);}
}

function renderLevel(){
  if(!L)return;
  if(L.impl.render)try{L.impl.render(L);}catch(e){console.error(e);}
}

function triggerWin(){
  if(appScene!=='play')return;
  appScene='win';
  joy.active=false;joy.pid=null;dragPos=null;
  if(L){
    var n=L.num;
    if(save.completed.indexOf(n)===-1)save.completed.push(n);
    persistSave();
  }
  tone(523,.12,'square',.06);
  tone(659,.12,'square',.06,0,.12);
  tone(784,.25,'square',.06,0,.24);
  burst(W/2,H/3,'#ffd166',24);
  burst(W/2,H/3,'#ff8fb1',16);
  showWinScreen();
}
function triggerLose(){
  if(appScene!=='play')return;
  appScene='lose';
  joy.active=false;joy.pid=null;dragPos=null;
  tone(200,.4,'sawtooth',.08,70);
  showLoseScreen();
}

function hideOverlay(){overlay.classList.remove('show');overlay.scrollTop=0;}
function showOverlayHTML(html){
  overlayContent.innerHTML=html;
  overlayContent.style.animation='none';
  void overlayContent.offsetWidth;
  overlayContent.style.animation='';
  overlay.classList.add('show');
  overlay.scrollTop=0;
}
function showMenuScreen(){
  appScene='menu';L=null;
  pauseBtn.classList.add('hidden');paused=false;
  var nextLevel=save.completed.length+1;
  if(nextLevel>50)nextLevel=1;
  var html='';
  html+='<div class="ov-emoji">😤</div>';
  html+='<h1 class="ov-title">Злата и Полина</h1>';
  html+='<p class="ov-subtitle">50 уникальных уровней безобразия! Все уровни открыты — играй любой!</p>';
  html+='<button class="ov-btn" data-action="play-next">Играть (ур. '+nextLevel+')</button>';
  html+='<button class="ov-btn secondary" data-action="level-select">Выбор уровня</button>';
  if(save.completed.length>0){
    html+='<div class="progress-info">Пройдено: '+save.completed.length+' из 50</div>';
    html+='<button class="ov-link" data-action="reset-progress">Сбросить прогресс</button>';
  }
  showOverlayHTML(html);
}
function showLevelSelect(){
  appScene='levelSelect';
  pauseBtn.classList.add('hidden');paused=false;
  var html='<div class="ov-emoji">🗂️</div><h1 class="ov-title">Выбор уровня</h1>';
  html+='<p class="ov-subtitle" style="margin-bottom:12px">Все 50 уровней открыты — листай вниз ⬇️</p>';
  html+='<div class="level-grid">';
  for(var i=1;i<=50;i++){
    var completed=save.completed.indexOf(i)!==-1;
    var cls='level-btn unlocked';
    if(completed)cls+=' completed';
    html+='<button class="'+cls+'" data-action="pick-level" data-level="'+i+'">'+i+'</button>';
  }
  html+='</div><button class="ov-btn secondary" data-action="back-menu">← В меню</button>';
  showOverlayHTML(html);
}
function showIntroScreen(num){
  appScene='intro';
  pauseBtn.classList.add('hidden');paused=false;
  var meta=META[num-1];
  var html='';
  html+='<div class="ov-emoji">'+meta.emoji+'</div>';
  html+='<h1 class="ov-title">Уровень '+num+'</h1>';
  html+='<p class="ov-subtitle">'+meta.title+'</p>';
  html+='<div class="ov-hint">'+meta.hint+'</div>';
  html+='<button class="ov-btn" data-action="start-level" data-level="'+num+'">Поехали!</button>';
  html+='<button class="ov-btn secondary" data-action="back-menu">← В меню</button>';
  showOverlayHTML(html);
}
function showWinScreen(){
  appScene='win';
  pauseBtn.classList.add('hidden');paused=false;
  var n=L?L.num:1;
  var isFinal=n===50;
  var html='';
  if(isFinal){
    html+='<div class="ov-emoji">🏆</div>';
    html+='<h1 class="ov-title">ПОБЕДА!</h1>';
    html+='<p class="ov-subtitle">Злата прошла все 50 уровней и довела маму до предела!</p>';
    html+='<button class="ov-btn" data-action="back-menu">В меню</button>';
  }else{
    var next=n+1;
    html+='<div class="ov-emoji">🎉</div>';
    html+='<h1 class="ov-title">Уровень '+n+' пройден!</h1>';
    html+='<p class="ov-subtitle">Впереди ещё '+(50-n)+' уровней безобразия!</p>';
    html+='<button class="ov-btn" data-action="start-level" data-level="'+next+'">Дальше (ур. '+next+') →</button>';
    html+='<button class="ov-btn secondary" data-action="back-menu">В меню</button>';
  }
  showOverlayHTML(html);
}
function showLoseScreen(){
  appScene='lose';
  pauseBtn.classList.add('hidden');paused=false;
  var html='';
  html+='<div class="ov-emoji">😱</div>';
  html+='<h1 class="ov-title">Поймали!</h1>';
  html+='<p class="ov-subtitle">Полина победила. Попробуй ещё раз!</p>';
  html+='<button class="ov-btn" data-action="retry">Ещё раз 🔁</button>';
  html+='<button class="ov-btn secondary" data-action="back-menu">В меню</button>';
  showOverlayHTML(html);
}
function showPauseScreen(){
  if(appScene!=='play')return;
  paused=true;appScene='paused';
  pauseBtn.classList.add('hidden');
  joy.active=false;joy.dx=0;joy.dy=0;joy.pid=null;
  var html='';
  html+='<div class="ov-emoji">⏸</div>';
  html+='<h1 class="ov-title">Пауза</h1>';
  html+='<button class="ov-btn" data-action="resume">Продолжить</button>';
  html+='<button class="ov-btn secondary" data-action="restart">Заново</button>';
  html+='<button class="ov-btn secondary" data-action="back-menu">В меню</button>';
  showOverlayHTML(html);
}

function validLevel(n){return Number.isFinite(n)&&n>=1&&n<=50;}
function actionPlayNext(){
  if(appScene!=='menu')return;
  var next=save.completed.length+1;
  if(next>50)next=1;
  showIntroScreen(next);
}
function actionLevelSelect(){if(appScene==='menu')showLevelSelect();}
function actionBackMenu(){hideOverlay();showMenuScreen();}
function actionPickLevel(n){if(appScene==='levelSelect'&&validLevel(n))showIntroScreen(n);}
function actionStartLevel(n){
  if((appScene!=='intro'&&appScene!=='win'))return;
  if(!validLevel(n))return;
  hideOverlay();paused=false;appScene='play';
  pauseBtn.classList.remove('hidden');
  initLevel(n);
}
function actionRetry(){
  if(appScene!=='lose'||!L)return;
  hideOverlay();paused=false;appScene='play';
  pauseBtn.classList.remove('hidden');
  initLevel(L.num);
}
function actionResume(){if(appScene!=='paused')return;
  hideOverlay();paused=false;appScene='play';pauseBtn.classList.remove('hidden');}
function actionRestart(){if(appScene!=='paused'||!L)return;
  hideOverlay();paused=false;appScene='play';pauseBtn.classList.remove('hidden');
  initLevel(L.num);}
function actionResetProgress(){
  try{if(window.confirm('Сбросить весь прогресс?')){
    save={completed:[]};persistSave();showMenuScreen();
  }}catch(e){}
}
function togglePause(){
  if(appScene==='play')showPauseScreen();
  else if(appScene==='paused')actionResume();
}
pauseBtn.addEventListener('click',function(e){
  e.preventDefault();
  if(actionCd>0)return;actionCd=.3;togglePause();
});
overlay.addEventListener('click',function(e){
  var btn=e.target.closest?e.target.closest('[data-action]'):null;
  if(!btn)return;
  if(actionCd>0)return;actionCd=.35;
  ensureAudio();
  tone(700,.06,'square',.05,900);
  var a=btn.dataset.action;
  if(a==='play-next')actionPlayNext();
  else if(a==='level-select')actionLevelSelect();
  else if(a==='back-menu')actionBackMenu();
  else if(a==='pick-level')actionPickLevel(parseInt(btn.dataset.level,10));
  else if(a==='start-level')actionStartLevel(parseInt(btn.dataset.level,10));
  else if(a==='retry')actionRetry();
  else if(a==='resume')actionResume();
  else if(a==='restart')actionRestart();
  else if(a==='reset-progress')actionResetProgress();
});

var lastTime=0;
function loop(ts){
  try{
    if(!lastTime)lastTime=ts;
    var dt=(ts-lastTime)/1000;
    lastTime=ts;
    if(dt>.06)dt=.06;
    if(dt<0)dt=0;
    if(actionCd>0)actionCd-=dt;
    game.t+=dt;
    updateParticles(dt);
    if(appScene==='play'&&L){
      updateLevel(dt);
    }
    render();
    tapQueued=null;
  }catch(e){try{console.error(e);}catch(er){}}
  requestAnimationFrame(loop);
}

function render(){
  ctx.clearRect(0,0,W,H);
  if(appScene==='menu'||appScene==='levelSelect'){
    drawRoomBg();
    Z.x=165;Z.y=555;Z.dir=1;Z.walking=false;
    P.x=320;P.y=555;P.dir=-1;P.walking=false;P.emotion='calm';P.armsUp=false;
    drawPolina(game.t,{emotion:'calm',armsUp:false});
    drawZlata(game.t,{emotion:'serious'});
    drawParticles();
    return;
  }
  if(appScene==='intro'||!L){
    drawRoomBg();
    Z.x=165;Z.y=555;Z.dir=1;Z.walking=false;
    P.x=320;P.y=555;P.dir=-1;P.walking=false;P.emotion='calm';P.armsUp=false;
    drawPolina(game.t,{emotion:'calm',armsUp:false});
    drawZlata(game.t,{emotion:'serious'});
    return;
  }
  if(L){
    renderLevel();
    drawParticles();
    if(shouldUseJoystick())drawJoystick();
    drawHUD();
    if(L.meta.hint)drawHint(L.meta.hint);
    if(game.flash>0){
      ctx.fillStyle='rgba(255,60,80,'+(game.flash*.5)+')';
      ctx.fillRect(0,0,W,H);
    }
  }
}

showMenuScreen();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
